name: Regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  resolver-fixtures:
    name: Resolver fixtures (tests/fixtures/p2-*.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Run resolver fixtures
        run: php bin/smoke.php --resolver-fixtures
